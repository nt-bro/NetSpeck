name: Build and offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Compile and run offline checks
        shell: powershell
        run: .\build.ps1
      - name: Package portable app
        shell: powershell
        run: .\scripts\package.ps1 -SkipBuild
      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TaskbarNet-win-x64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
